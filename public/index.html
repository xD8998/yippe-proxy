<!DOCTYPE html>
<html>
<head>
    <title>Yippe Proxy</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #1a1a1a; color: white; display: flex; flex-direction: column; height: 100vh; }
        .tab-bar { display: flex; background: #222; padding: 10px; border-bottom: 2px solid #333; }
        #search { flex-grow: 1; padding: 12px; border-radius: 5px; border: none; background: #333; color: white; }
        iframe { flex-grow: 1; border: none; background: white; }
    </style>
    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv.config.js"></script>
</head>
<body>
    <div class="tab-bar">
        <input type="text" id="search" placeholder="Type URL and hit Enter..." autocomplete="off">
    </div>
    <iframe id="proxy-frame" src="about:blank"></iframe>

    <script>
        const input = document.getElementById('search');

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js', {
                scope: __uv$config.prefix
            }).then(() => console.log("Engine Ready"));
        }

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                let url = input.value.trim();
                if (!url.includes('.')) url = 'https://www.google.com/search?q=' + url;
                else if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
                
                document.getElementById('proxy-frame').src = __uv$config.prefix + __uv$config.encodeUrl(url);
            }
        });
    </script>
</body>
</html>
