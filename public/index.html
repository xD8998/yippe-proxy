<!DOCTYPE html>
<html>
<head>
    <title>Yippe Proxy</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        #search { width: 100%; padding: 15px; background: #333; border: none; color: white; outline: none; }
        iframe { flex-grow: 1; border: none; background: white; }
    </style>
    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv.config.js"></script>
</head>
<body>
    <input type="text" id="search" placeholder="Enter URL...">
    <iframe id="proxy-frame"></iframe>

    <script>
        const input = document.getElementById('search');
        const frame = document.getElementById('proxy-frame');

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js', {
                scope: __uv$config.prefix
            });
        }

        input.onkeydown = (e) => {
            if (e.key === 'Enter') {
                let url = input.value.trim();
                if (!url.includes('.')) url = 'https://google.com/search?q=' + url;
                else if (!url.startsWith('http')) url = 'https://' + url;
                
                frame.src = __uv$config.prefix + __uv$config.encodeUrl(url);
            }
        };
    </script>
</body>
</html>
